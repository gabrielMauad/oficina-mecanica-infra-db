name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Roda em push na main (pos-merge) e em workflow_dispatch (reexecucao manual, por exemplo apos
  # renovar as credenciais temporarias da sessao AWS Academy, sem precisar de um novo commit).
  # Nao roda em pull_request: aplicar infraestrutura de um PR nao revisado seria arriscado.
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Academy Learner Lab emite apenas credenciais temporarias (access key, secret key e
      # session token) - sem session token a autenticacao falha, por isso ele e obrigatorio aqui.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Backend parcial (ver main.tf): bucket/key/region entram aqui, nao no codigo.
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-db/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_infra_k8s_state_bucket: ${{ vars.TF_STATE_BUCKET }}
